[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komyt"
version = "0.1.0"
description = "Automated ticket-to-PR development pipeline powered by OpenCode"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Emerick Salmon", email = "emerick.salmon@gmail.com" },
]
keywords = ["automation", "ai", "coding-agent", "opencode", "ticket-to-pr"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    # CLI
    "typer>=0.15",
    "rich>=13.0",
    # Web/GUI
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # Data
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Git & GitHub
    "gitpython>=3.1",
    "pygithub>=2.0",
    # Docker
    "docker>=7.0",
    # AI Agent
    "opencode-agent-sdk>=0.4",
    # Config
    "tomli>=2.0",
    "tomli-w>=1.0",
    # Utils
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # E2E / Functional
    "testcontainers>=4.0",
    "httpx>=0.27",         # for testing FastAPI with async client
    "respx>=0.22",         # for mocking httpx requests
]

[project.scripts]
komyt = "komyt.cli:app"

[project.urls]
Homepage = "https://github.com/EmerickSalmon/komyt"
Repository = "https://github.com/EmerickSalmon/komyt"
Issues = "https://github.com/EmerickSalmon/komyt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/komyt"]

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["komyt"]

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests — fast, no external dependencies",
    "functional: Functional tests — may use local services (Docker, DB)",
    "e2e: End-to-end tests — full pipeline, requires OpenCode server + Docker",
    "slow: Tests that take more than 10 seconds",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# ── Mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*", "opencode_agent_sdk.*", "git.*"]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────────
[tool.coverage.run]
source = ["src/komyt"]
omit = ["src/komyt/gui/templates/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
