<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Komyt Dashboard{% endblock %}</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --yellow: #d29922;
            --red: #f85149;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .logo { font-weight: 700; font-size: 18px; color: var(--accent); }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
        nav a:hover { color: var(--text); }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 24px; margin-bottom: 16px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { font-size: 14px; }
        .status { padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-completed { background: rgba(63,185,80,0.15); color: var(--green); }
        .status-failed { background: rgba(248,81,73,0.15); color: var(--red); }
        .status-developing, .status-analyzing, .status-preparing { background: rgba(210,153,34,0.15); color: var(--yellow); }
        .status-queued { background: rgba(139,148,158,0.15); color: var(--text-muted); }
        a.link { color: var(--accent); text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; font-size: 14px; }
        .kv dt { color: var(--text-muted); }
        .empty { color: var(--text-muted); text-align: center; padding: 48px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <span class="logo">Komyt</span>
        <a href="/">Dashboard</a>
        <a href="/config">Config</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
